---
# yamllint disable rule:line-length
name: Bump Homebrew formula

# yamllint disable rule:truthy
on:
  workflow_run:
    workflows:
      - Upload Python Package
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Version to bump to (default: latest on PyPI)"
        required: false

permissions:
  contents: write

concurrency:
  group: brew-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FORMULA: morph027/aws-ssm-juggle/aws-ssm-juggle
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
      - name: Tap this repository
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/morph027"
          ln -sfn "${GITHUB_WORKSPACE}" "$(brew --repository)/Library/Taps/morph027/homebrew-aws-ssm-juggle"
          brew trust morph027/aws-ssm-juggle
      - name: Resolve sdist from PyPI
        id: pypi
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # PyPI may need a moment to serve a freshly published release
          for _ in $(seq 1 10); do
            if json="$(curl -fsSL "https://pypi.org/pypi/aws-ssm-juggle/${VERSION:+${VERSION}/}json")"; then
              break
            fi
            sleep 30
          done
          [ -n "${json:-}" ] || { echo "Could not fetch PyPI metadata"; exit 1; }
          python3 - "${json}" >>"${GITHUB_OUTPUT}" <<'EOF'
          import json, sys
          data = json.loads(sys.argv[1])
          sdist = next(u for u in data["urls"] if u["packagetype"] == "sdist")
          print(f"version={data['info']['version']}")
          print(f"url={sdist['url']}")
          print(f"sha256={sdist['digests']['sha256']}")
          EOF
      - name: Check current formula version
        id: current
        run: |
          echo "version=$(brew info --json=v2 "${FORMULA}" | jq -r '.formulae[0].versions.stable')" >>"${GITHUB_OUTPUT}"
      - name: Bump formula
        if: steps.current.outputs.version != steps.pypi.outputs.version
        env:
          URL: ${{ steps.pypi.outputs.url }}
          SHA256: ${{ steps.pypi.outputs.sha256 }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          # updates url/sha256 and regenerates all python resource blocks
          brew bump-formula-pr --write-only --no-audit --no-browse --url="${URL}" --sha256="${SHA256}" "${FORMULA}"
      - name: Install, test and audit
        if: steps.current.outputs.version != steps.pypi.outputs.version
        run: |
          brew install --build-from-source "${FORMULA}"
          brew test "${FORMULA}"
          brew audit --strict "${FORMULA}"
      - name: Commit and push
        if: steps.current.outputs.version != steps.pypi.outputs.version
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/aws-ssm-juggle.rb
          git commit -m "brew: aws-ssm-juggle ${VERSION}"
          git push
