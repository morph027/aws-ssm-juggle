---
# yamllint disable rule:line-length
name: release

# yamllint disable rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  binary:
    runs-on: ${{ matrix.arch.runner }}
    env:
      DEBIAN_FRONTEND: noninteractive
    strategy:
      matrix:
        arch:
          - name: x86_64
            runner: ubuntu-24.04
          - name: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build ec2-juggle binary for ${{ matrix.arch.name }}
        run: scripts/build-binary.sh
        env:
          DEBUG: ${{ runner.debug && 1 || 0 }}
      - name: Release assets
        uses: softprops/action-gh-release@v3
        with:
          files: dist/linux/*/ec2-juggle_*
          fail_on_unmatched_files: true
